image:
  repository: digitalbss/db-update
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
migration:
  enabled: true
  runId: initial-2-2-6-21
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
database:
  host: mssql
  name: UCP
  user: sa
  existingSecret: mssql-auth
  passwordKey: password
  trustServerCertificate: true
  createIfMissing: true
applicationVersion: 2.2.6.21
filegroups:
  partition10: 1
  partition10d14: 1
  partition10d: 1
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
bootstrapUser:
  name: UCP_user
  existingSecret: db-update-bootstrap
  passwordKey: password
