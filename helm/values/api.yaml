nameOverride: ''
fullnameOverride: ''
replicaCount: 1
revisionHistoryLimit: 3
image:
  repository: digitalbss/api
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
containerPort: 5000
service:
  type: ClusterIP
  port: 5000
  nodePort: null
  annotations: {}
serviceAccount:
  create: true
  name: ''
  annotations: {}
automountServiceAccountToken: false
podLabels: {}
podAnnotations: {}
podSecurityContext:
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
deployment:
  strategy:
    type: Recreate
terminationGracePeriodSeconds: 60
env:
  ASPNETCORE_URLS: http://+:5000
  ASPNETCORE_ENVIRONMENT: Production
  TZ: UTC
  ConnectionStrings__UCPDbConnection:
    valueFrom:
      secretKeyRef:
        name: api-secrets
        key: ucpDbConnection
  ConnectionStrings__pgvector:
    valueFrom:
      secretKeyRef:
        name: api-secrets
        key: pgvector
  # ProductCatalogAI storage provider prefix, as declared by the plugin package.
  ChatBot_Storage__Connection:
    valueFrom:
      secretKeyRef:
        name: api-secrets
        key: pgvector
  # Required Microsoft sign-in credential; fill the separate Secret before installation.
  AuthOptions__EntraId__ClientSecret:
    valueFrom:
      secretKeyRef:
        name: api-secrets
        key: entraClientSecret
        optional: false
envFrom: []
command: []
args: []
initContainers: []
lifecycle: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi
startupProbe:
  httpGet:
    path: /api/v0/live
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /api/v0/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe: {}
config:
  enabled: true
  existingConfigMap: ''
  existingSecret: ''
  data: {}
  mounts:
  - key: appsettings.json
    mountPath: /app/appsettings.json
  appsettings:
    FileVersion: ''
    ConnectionStrings:
      UCPDbConnection: ''
      providerName: System.Data.SqlClient
      pgvector: ''
    Serilog:
      EnableTrace: false
      MinimumLevel: Information
      Using:
      - UCP.API
      WriteTo:
      - Name: Conditional
        Args:
          expression: true
          configureSink:
          - Name: Console
      - Name: Conditional
        Args:
          expression: false
          configureSink:
          - Name: File
            Args:
              path: /storage/ProdK8S/logs/ucp.api.log
              rollingInterval: Day
              rollOnFileSizeLimit: true
              fileSizeLimitBytes: '524288000'
              retainedFileCountLimit: 7
      - Name: Conditional
        Args:
          expression: Coalesce(response_headers['nodepoint'], '') not in ['1', '2',
            '3']
          configureSink:
          - Name: MSSqlServer
            Args:
              connectionString: ''
              tableName: Slogs
              autoCreateSqlTable: true
              columnOptionsSection:
                additionalColumns:
                - ColumnName: ReplicaId
                  DataType: INT
                  AllowNull: true
              BatchPostingLimit: 50
              Period: 00:00:05
              RetryTimeLimit: 00:10:00
              QueueLimit: 100000
      - Name: Conditional
        Args:
          expression: response_headers['nodepoint'] = '1'
          configureSink:
          - Name: MSSqlServer
            Args:
              connectionString: ''
              tableName: SLogs
              autoCreateSqlTable: true
      - Name: Logger
        Args:
          configureLogger:
            WriteTo:
            - Name: Elasticsearch
              Args:
                nodeUris: http://elasticsearch:9200
                connectionGlobalHeaders: ''
                indexFormat: mef-workflow-{0:yyyy.MM}
            Filter:
            - Name: ByIncludingOnly
              Args:
                expression: GroupId = 'Workflow'
            Enrich:
            - FromLogContext
    Settings:
      StorageFolder: /storage/ProdK8S
      CookieOptions:
        Secure: true
        SameSite: 0
      SerilogSelfLogEnable: false
      SerilogSelfLogPath: /storage/ProdK8S/logs/serilog.self.log
      PluginLifetime: 10080
      CSPForward: https://apps.example.com
      EntityGenerator:
        Enabled: false
        Url: http://entity-generator:8080
    AuthOptions:
      Issuer: https://api.example.com
      Audience:
      - https://apps.example.com
      MultiTenant: false
      MultiTenantAudiences:
      - https://apps.example.com
      Domain: example.com
      # MEF access tokens currently omit iss/aud; signature validation stays enabled.
      ValidateIssuer: false
      ValidateAudience: false
      ValidateIssuerSigningKey: true
      RefreshTokenRestrictByIp: true
      Lifetime: 10
      Google:
        ClientId: ''
        ClientSecret: ''
      Linkedin:
        ClientId: ''
        ClientSecret: ''
      IdGovUaAuth: false
      PasswordAuth: true
      Password:
        RequireDigit: true
        RequireLowercase: true
        RequireUppercase: true
        RequireNonAlphanumeric: true
        RequiredLength: 12
      User: {}
      EntraIdAuthUrl: https://login.microsoftonline.com/REPLACE_ENTRA_TENANT_ID
      EntraId:
        ClientId: REPLACE_ENTRA_CLIENT_ID
        ClientSecret: ''
      Network: Internet
      AuthenticationTypes:
      - CloudAP
      - Negotiate
      - NTLM
      - Kerberos
      GoogleAuth: false
      LinkedinAuth: false
      EntraIdAuth: true
      IdGovUa:
        ClientSecret: ''
        PKeyPassword: ''
    OpendatabotApiKey: ''
    ForceDisableSwaggerAuth: false
    Logging:
      LogLevel:
        Default: Information
        System: Information
        Microsoft: Warning
  disabledLogSinks:
  - 1
  - 2
  - 3
  - 4
persistence:
  enabled: false
  existingClaim: ''
  storageClass: ''
  accessModes:
  - ReadWriteOnce
  size: 1Gi
  retain: true
  annotations: {}
  mountPath: /storage
  subPath: ''
volumes:
- name: front
  persistentVolumeClaim:
    claimName: front
- name: api-config
  persistentVolumeClaim:
    claimName: api-config
volumeMounts:
- name: front
  mountPath: /storage/ProdK8S
- name: api-config
  mountPath: /config
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
dnsConfig: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
networking:
  mode: none
ingress:
  className: ''
  annotations: {}
  hosts: []
  tls: []
gateway:
  parentRefs: []
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
