nameOverride: ''
fullnameOverride: ''
replicaCount: 1
revisionHistoryLimit: 3
image:
  repository: plantuml/plantuml-server
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
containerPort: 8080
service:
  type: ClusterIP
  port: 8080
  nodePort: null
  annotations: {}
serviceAccount:
  create: true
  name: ''
  annotations: {}
automountServiceAccountToken: false
podLabels: {}
podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
deployment:
  strategy:
    type: Recreate
terminationGracePeriodSeconds: 60
env: {}
envFrom: []
command: []
args: []
initContainers: []
lifecycle: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
livenessProbe: {}
config:
  enabled: false
  existingConfigMap: ''
  existingSecret: ''
  data: {}
  mounts: []
persistence:
  enabled: false
  existingClaim: ''
  storageClass: ''
  accessModes:
  - ReadWriteOnce
  size: 1Gi
  retain: true
  annotations: {}
  mountPath: /storage
  subPath: ''
volumes: []
volumeMounts: []
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
dnsConfig: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
networking:
  mode: none
ingress:
  className: ''
  annotations: {}
  hosts: []
  tls: []
gateway:
  parentRefs: []
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
