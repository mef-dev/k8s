apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mef-gateway
spec:
  gatewayClassName: mef-traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 8000
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 8443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: mef-tls
    allowedRoutes:
      namespaces:
        from: Same
