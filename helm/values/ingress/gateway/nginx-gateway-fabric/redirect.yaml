apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mef-https-redirect
spec:
  parentRefs:
  - name: mef-gateway
    sectionName: http
  hostnames:
  - apps.example.com
  - api.example.com
  - servicehost.example.com
  - knowledge-graph.example.com
  - plantuml.example.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
        port: 443
