{{- if and .Values.config.enabled (not .Values.config.existingConfigMap) (not .Values.config.existingSecret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.configName" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  {{- if not (hasKey .Values.config.data "appsettings.json") }}
  appsettings.json: {{ include "api.appsettings" . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
