{{- range $name, $claim := .Values.claims }}
{{- if $claim.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  {{- if $claim.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml $claim.accessModes | nindent 4 }}
  {{- if eq $claim.storageClass "-" }}
  storageClassName: ""
  {{- else if $claim.storageClass }}
  storageClassName: {{ $claim.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $claim.size | quote }}
{{- end }}
{{- end }}
